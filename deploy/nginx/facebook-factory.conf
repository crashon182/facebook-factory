# Nginx como proxy inverso con HTTPS para Facebook Factory.
# Reemplazá TU-DOMINIO.com y obtené el certificado con:  sudo certbot --nginx -d TU-DOMINIO.com
# Copiar a /etc/nginx/sites-available/facebook-factory y enlazar en sites-enabled.

# Límite de intentos de login (además del límite propio de la aplicación, que usa Redis)
limit_req_zone $binary_remote_addr zone=ff_login:10m rate=10r/m;

upstream ff_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name TU-DOMINIO.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name TU-DOMINIO.com;

    ssl_certificate     /etc/letsencrypt/live/TU-DOMINIO.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU-DOMINIO.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    # Las generaciones con IA se ejecutan dentro de la petición y pueden tardar más de un minuto
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # Subida de archivos multimedia (hasta 300 MB de video)
    location = /api/media/upload {
        client_max_body_size 330m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://ff_web;
    }

    # Login: limitar intentos
    location = /api/auth/callback/credentials {
        limit_req zone=ff_login burst=5 nodelay;
        proxy_pass http://ff_web;
    }

    # Videos e imágenes (autenticados por la aplicación): sin buffering para el reproductor (Range)
    location /api/files/ {
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://ff_web;
    }

    # Webhook de Meta: sin límites propios (la firma se valida en la aplicación)
    location = /api/webhooks/meta {
        proxy_pass http://ff_web;
    }

    # Archivos estáticos inmutables de Next.js
    location /_next/static/ {
        proxy_pass http://ff_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://ff_web;
    }
}
