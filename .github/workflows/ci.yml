# CI en cada push y PR; en `main`, si todo pasa, despliega por SSH (solo si DEPLOY_ENABLED = true).
# Configuración de secrets/variables: docs/DEPLOY-CLOUDPANEL.md §8
name: CI y despliegue

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: facebook_factory
          MYSQL_USER: ff_user
          MYSQL_PASSWORD: ci_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # Valores solo para CI (sin secretos reales)
      DATABASE_URL: mysql://root:ci_root@127.0.0.1:3306/facebook_factory
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: ci-auth-secret-no-es-un-secreto-0123456789abcdef
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: FFmpeg con drawtext y fuentes DejaVu (las pruebas de render los usan)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -hide_banner -filters | grep -q drawtext
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    # Un despliegue a la vez y nunca se cancela uno a mitad de camino (migraciones, build, recarga)
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Desplegar por SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_PATH; do
            [ -n "${!v}" ] || { echo "::error::Falta el secret $v"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Host verificado contra known_hosts (sin confiar en el primer contacto). Login shell para cargar node/pm2 del usuario.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -lc 'cd \"$DEPLOY_PATH\" && BACKUP_BEFORE_DEPLOY=1 ./scripts/deploy.sh'"
      - name: Limpiar clave
        if: always()
        run: rm -f ~/.ssh/deploy_key
